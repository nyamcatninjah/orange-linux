name: Build OrangeLinux ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - name: Write build script
        run: |
          cat > build.sh <<'ORANGE_EOF'
          #!/usr/bin/env bash
          #
          # OrangeLinux 0.1 "Sharkz" — Debian-based build recipe
          # A Linux built my way
          #
          # Builds a bootable hybrid ISO (BIOS + UEFI) on top of Debian 13 "trixie"
          # using Debian's own live-build tool.
          #
          # Run on a Debian or Ubuntu machine (PC, VM, or cloud CI) as root:
          #   chmod +x build-OrangeLinux-debian.sh
          #   sudo ./build-OrangeLinux-debian.sh
          #
          # Needs ~15 GB free disk space and an internet connection.
          # Output: OrangeLinux-0.1-x86_64.iso

          set -euo pipefail

          NAME="OrangeLinux"
          VERSION="0.1"
          CODENAME="Sharkz"
          ARCH="amd64"
          DEBIAN_RELEASE="trixie"          # Debian 13 (has KDE Plasma 6)
          LIVE_USER="orange"               # live session login (default password: live)
          OUT="${NAME}-${VERSION}-x86_64.iso"
          WORKDIR="$PWD/orangelinux-build"

          if [ "$(id -u)" -ne 0 ]; then
            echo "This script must run as root (live-build needs it)."
            echo "Re-run with: sudo ./$(basename "$0")"
            exit 1
          fi

          # --- Build dependencies ------------------------------------------------------
          echo "==> Checking build dependencies…"
          if ! command -v lb >/dev/null 2>&1 \
             || ! command -v debootstrap >/dev/null 2>&1 \
             || ! command -v xorriso >/dev/null 2>&1 \
             || ! command -v mksquashfs >/dev/null 2>&1; then
            echo "  Installing live-build, debootstrap, xorriso, squashfs-tools…"
            apt-get update
            apt-get install -y live-build debootstrap xorriso squashfs-tools \
              debian-archive-keyring ca-certificates
          fi

          # --- Fresh work directory ----------------------------------------------------
          echo "==> Preparing live-build config for $NAME $VERSION ($ARCH)"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"

          lb config \
            --distribution "$DEBIAN_RELEASE" \
            --architectures "$ARCH" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --bootloaders "syslinux,grub-efi" \
            --debian-installer none \
            --security true \
            --updates true \
            --iso-application "$NAME" \
            --iso-publisher "$NAME" \
            --iso-volume "${NAME}-${VERSION}" \
            --bootappend-live "boot=live components quiet splash username=${LIVE_USER} hostname=${NAME} locales=en_GB.UTF-8 keyboard-layouts=gb timezone=Europe/London"

          # --- Package list ------------------------------------------------------------
          mkdir -p config/package-lists
          cat > config/package-lists/orange.list.chroot <<'EOF'
          # Base live system
          live-boot
          live-config
          live-config-systemd
          linux-image-amd64
          firmware-linux
          sudo
          locales

          # Desktop: KDE Plasma 6
          kde-plasma-desktop
          sddm
          plasma-discover
          plasma-discover-backend-flatpak
          plymouth
          plymouth-themes

          # Apps
          firefox-esr
          thunderbird
          libreoffice
          vlc
          git
          htop
          flatpak

          # Services
          network-manager
          firewalld
          chrony

          # Graphical installer
          calamares
          calamares-settings-debian
          EOF

          # --- Files copied into the live system ---------------------------------------
          mkdir -p config/includes.chroot/etc

          # Login banner / "boot ASCII art"
          cat > config/includes.chroot/etc/issue <<EOF

            ORANGELINUX ${VERSION} "${CODENAME}"
            A Linux built my way  (based on Debian ${DEBIAN_RELEASE})

          EOF

          # OS identity (shown in "About this system", fastfetch, etc.)
          cat > config/includes.chroot/etc/orangelinux-release <<EOF
          NAME="${NAME}"
          VERSION="${VERSION} (${CODENAME})"
          ID=orangelinux
          ID_LIKE=debian
          PRETTY_NAME="${NAME} ${VERSION} ${CODENAME}"
          EOF

          # --- Chroot hook: runs inside the new system during build --------------------
          mkdir -p config/hooks/normal
          cat > config/hooks/normal/0100-orange-setup.hook.chroot <<'EOF'
          #!/bin/sh
          set -e
          # Enable services
          systemctl enable NetworkManager firewalld chrony sddm || true
          # Flathub for extra apps (e.g. Steam via Flatpak)
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
          EOF
          chmod +x config/hooks/normal/0100-orange-setup.hook.chroot

          # --- Build -------------------------------------------------------------------
          echo "==> Building ISO with live-build (this takes a while)…"
          lb build

          BUILT_ISO="$(find "$WORKDIR" -maxdepth 1 -name '*.iso' -type f | head -n1)"
          if [ -z "$BUILT_ISO" ]; then
            echo "ERROR: live-build did not produce an ISO. Check the log above." >&2
            exit 1
          fi

          cd - >/dev/null
          echo "==> Copying built image to $OUT"
          cp "$BUILT_ISO" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

          echo
          echo "========================================================"
          echo "  $NAME $VERSION \"$CODENAME\" built successfully."
          echo "  Output:        $OUT"
          echo "  Checksum:      $OUT.sha256"
          echo "  Architecture:  x86_64"
          echo "  Base:          Debian 13 (trixie)"
          echo "  Desktop:       KDE Plasma 6"
          echo "  Installer:     Calamares (GUI)"
          echo "  Live login:    $LIVE_USER / live"
          echo "========================================================"
          echo
          echo "Flash to USB:  sudo dd if=$OUT of=/dev/sdX bs=4M status=progress"
          echo "Or test in a VM: qemu-system-x86_64 -m 4G -enable-kvm -cdrom $OUT"
          echo "(Delete the build folder when done: sudo rm -rf $WORKDIR)"
          ORANGE_EOF

      - name: Build ISO inside Debian trixie
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work debian:trixie \
            bash ./build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: OrangeLinux-ISO
          path: |
            OrangeLinux-*.iso
            OrangeLinux-*.iso.sha256
          compression-level: 0
